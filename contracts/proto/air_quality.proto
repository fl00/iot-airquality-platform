syntax = "proto3";

package iot.airquality;

// Wire contract between a sensor node and the ingestor.
// Transport: MQTT, one AirQualityPacket per message on sensors/<device_id>/airquality.

// Health of the sensor node at the time of the measurement.
enum SensorStatus {
  STATUS_OK = 0;          // All sensors deliver valid measurements
  STATUS_WARMING_UP = 1;  // Sensors answer but are still stabilising or calibrating
  STATUS_DEGRADED = 2;    // At least one sensor is silent; its fields are 0
  STATUS_FAULT = 3;       // No sensor answers
}

// One complete measurement. A field whose sensor is missing is 0 (never NaN).
message FullSample {
  float temperature_celsius = 1;  // Ambient temperature, °C
  float humidity_percent = 2;     // Relative humidity, 0-100 %
  uint32 co2_ppm = 3;             // CO2 concentration, ppm
  float pm25_ug_m3 = 4;           // PM2.5, µg/m³
  float pm10_ug_m3 = 5;           // PM10, µg/m³
  float tvoc_ppb = 6;             // VOC, ppb (BSEC breath-VOC equivalent on the BME680)
  float pressure_hpa = 7;         // Atmospheric pressure, hPa
  // Diagnostic values of the BME680 (BSEC library). Stored to check the VOC thresholds;
  // not used for the AQI level.
  float static_iaq = 8;           // BSEC static IAQ index, 0 (clean) to 500
  uint32 iaq_accuracy = 9;        // BSEC calibration state: 0 (not calibrated) to 3 (fully calibrated)
}

message AirQualityPacket {
  // Field 8 carried a delta-encoded batch that V1 never used (see ADR 0005).
  reserved 8;
  reserved "delta_batch";

  string device_id = 1;           // [A-Za-z0-9_-]{1,31}; must equal the id in the MQTT topic
  uint32 sequence_number = 2;     // Incremented per packet; restarts at 1 after a reboot
  uint64 base_timestamp_sec = 3;  // Measurement time, Unix seconds UTC; 0 = clock not synchronised
  uint32 battery_millivolts = 4;  // Battery voltage, mV; 0 = mains powered
  sint32 rssi_dbm = 5;            // Wi-Fi signal strength, dBm
  SensorStatus status = 6;
  FullSample full_sample = 7;
}
