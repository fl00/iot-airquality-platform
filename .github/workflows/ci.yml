name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto
          sudo systemctl stop mosquitto
          # influxd binary for the end-to-end test, taken from the official image
          docker create --name influx influxdb:2.7
          sudo docker cp influx:/usr/local/bin/influxd /usr/local/bin/influxd
          docker rm influx
          pip install -r dashboard/requirements.txt protobuf paho-mqtt
          git clone --quiet --depth 1 --branch 0.4.9 https://github.com/nanopb/nanopb.git "$RUNNER_TEMP/nanopb"

      - name: Run all checks
        run: NANOPB_DIR="$RUNNER_TEMP/nanopb" make test
