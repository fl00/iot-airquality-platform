name: CI & Architecture Verification Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Build & Architectural Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies & Protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler mosquitto mosquitto-clients

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dashboard/requirements.txt
          pip install protobuf paho-mqtt

      - name: Compile Protobuf Contracts & Build Rust Ingestor (make build)
        run: make build

      - name: Run Complete Architectural Test Suite (make test)
        run: make test

      - name: Verify JavaScript Syntax & Static Assets
        run: |
          node -c dashboard/static/js/stream.js
          node -c dashboard/static/js/chart.js
