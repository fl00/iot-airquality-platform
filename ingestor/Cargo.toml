[package]
name = "iot-airquality-ingestor"
version = "1.0.0"
edition = "2021"
description = "MQTT (Protobuf) to InfluxDB ingestion service for the IoT Air Quality Platform"

[dependencies]
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
# No TLS feature on purpose: V1 talks to local services in clear text (ADR 0005).
rumqttc = { version = "0.24", default-features = false }
prost = "0.13"
reqwest = { version = "0.12", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
