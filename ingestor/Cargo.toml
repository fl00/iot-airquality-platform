[package]
name = "iot-airquality-ingestor"
version = "1.0.0"
edition = "2021"
authors = ["Principal Systems Engineer <iot-arch@baremetal.internal>"]
description = "Ultra-low-footprint zero-bloat Protobuf MQTT to InfluxDB Ingestion Engine"

[dependencies]
tokio = { version = "1.38", features = ["full", "signal"] }
rumqttc = { version = "0.24", default-features = false, features = ["use-rustls"] }
prost = "0.13"
prost-types = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
prost-build = { version = "0.13", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
