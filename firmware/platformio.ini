; ==============================================================================
; PlatformIO Project Configuration File for ESP32 Air Quality Firmware
; Zero-Bloat Bare-Metal IoT Platform (Static Memory, TWDT, Store-and-Forward)
; ==============================================================================

[env:esp32dev]
platform = espressif32 @ ^6.6.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Board Partition Scheme: Enable LittleFS for Store-and-Forward queue
board_build.filesystem = littlefs
board_build.partitions = default_8MB.csv

; Build flags: Strict static optimization, preprocessor definitions
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D MOCK_SENSOR_DATA=1
    -D PB_FIELD_32BIT=1
    -D PB_NO_ERRMSG=1
    -D CONFIG_LITTLEFS_FOR_IDF_3_2=1
    -O2
    -Wall
    -Wextra

; Library Dependencies: Nanopb, PubSubClient, LittleFS
lib_deps = 
    nanopb/Nanopb @ ^0.4.8
    knolleary/PubSubClient @ ^2.8
    lorol/LittleFS_esp32 @ ^1.0.6
