; ==============================================================================
; PlatformIO Project Configuration File for ESP32 Air Quality Firmware
; Hardware: ESP32 DevKit (WROOM-32, 4 MB flash) + BME680 (I2C) + PMS7003 (UART2)
; ==============================================================================

[env:esp32dev]
platform = espressif32 @ ^6.6.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; LittleFS (bundled with arduino-esp32 2.x) lives in the 1.4 MB data partition of
; the stock 4 MB layout: store-and-forward queue + BSEC calibration state.
board_build.filesystem = littlefs
board_build.partitions = default.csv

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D PB_FIELD_32BIT=1
    -D PB_NO_ERRMSG=1
    -O2
    -Wall
    -Wextra

; BSEC is Bosch's closed-source fusion library (pre-compiled blob, Bosch licence):
; it turns the BME680 raw gas resistance into IAQ / eCO2 / bVOC estimates.
lib_deps =
    nanopb/Nanopb @ ^0.4.8
    knolleary/PubSubClient @ ^2.8
    boschsensortec/BSEC Software Library @ 1.8.1492

; Bench build without any sensor wired: synthetic data, same wire format.
[env:esp32dev-mock]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -D MOCK_SENSOR_DATA=1
