# ==============================================================================
# Linux Kernel Performance Tuning for Bare-Metal Edge IoT Node
# Optimizes TCP buffer sizing, connection recycling, and VM swappiness for <50MB RAM
# ==============================================================================

# TCP Fast Open: Enable for both client and server connections
net.ipv4.tcp_fastopen = 3

# Minimize unacknowledged outbound TCP queue latency (SSE / WebSockets)
net.ipv4.tcp_notsent_lowat = 16384

# High connection concurrency & fast socket recycling
net.core.somaxconn = 4096
net.core.netdev_max_backlog = 4096
net.ipv4.tcp_max_syn_backlog = 4096
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15

# Disable slow start restart after idle to maintain high responsiveness for bursty IoT telemetry
net.ipv4.tcp_slow_start_after_idle = 0

# Aggressive TCP window and buffer tuning for low-memory constraint
net.ipv4.tcp_rmem = 4096 87380 1048576
net.ipv4.tcp_wmem = 4096 65536 1048576

# Memory & Virtual Memory Subsystem Tuning (Prevent unnecessary swap thrashing on 1GB RAM)
vm.swappiness = 10
vm.vfs_cache_pressure = 50
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10
