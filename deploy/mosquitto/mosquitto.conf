# ==============================================================================
# Mosquitto MQTT Broker - Bare-Metal Hardened & Memory-Capped Configuration
# Target RAM Footprint: < 8.0 MB RSS
# ==============================================================================

# Network Listener
listener 1883 0.0.0.0
allow_anonymous true

# Memory & Queue Hardening (Zero-Bloat Protection)
# Prevents memory exhaustion in case of high-frequency sensor reconnection storms
max_queued_messages 1024
max_queued_bytes 4194304
memory_limit 8388608

# In-flight Message Throughput Controls
max_inflight_messages 20
max_packet_size 1024

# Pure In-Memory Operations (Zero Disk I/O Bottlenecks for Telemetry Stream)
persistence false

# Logging Configuration
log_dest stdout
log_type error
log_type warning
