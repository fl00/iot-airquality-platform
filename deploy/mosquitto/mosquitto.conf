# Mosquitto settings for the IoT Air Quality Platform.
# Installed as /etc/mosquitto/conf.d/99-iot.conf, on top of the distribution defaults.

# Sensor nodes connect over the LAN: every client must authenticate.
# Accounts are created by deploy-baremetal.sh (mosquitto_passwd).
listener 1883 0.0.0.0
allow_anonymous false
password_file /etc/mosquitto/passwd

# A packet is about 70 bytes; refuse anything unreasonably large.
max_packet_size 1024
